<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      ============================================================
      This file is mostly static. Everything SEO-related (title,
      description, Open Graph, Twitter, canonical, JSON-LD,
      verification tokens, Google tag, theme color, <html lang>) is
      injected from src/config/siteConfig.ts at build time.
      Favicon / manifest files live in /public.
      ============================================================
    -->

    <!-- Favicon & icons (D&TE truck mark). Files live in /public. -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Meta viewport -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
      SEO, social-share, structured-data and analytics tags are generated from
      src/config/siteConfig.ts (the `seo` block) by vite-plugin-site-head.ts.
      Edit them there, NOT here.
    -->
    <!-- SITE_HEAD -->

    <!-- Preconnect to speed up font loading -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
