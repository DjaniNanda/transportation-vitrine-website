<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      ============================================================
      This file is mostly static. Everything SEO-related (title,
      description, Open Graph, Twitter, canonical, JSON-LD,
      verification tokens, Google tag, theme color, <html lang>) is
      injected from src/config/siteConfig.ts at build time.
      What's left to check by hand: the favicon / manifest files in
      /public (make sure they're D&TE's, not a previous site's).
      ============================================================
    -->

    <!-- Favicon & icons — TODO: make sure these files in /public are D&TE's, not the previous site's -->
    <link rel="icon" href="/favicon.ico?v=2" sizes="32x32">
    <link rel="icon" href="/favicon.svg?v=2" type="image/svg+xml">
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png?v=2" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=2" />
    <link rel="manifest" href="/site.webmanifest?v=2" />

    <!-- Meta viewport -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
      SEO, social-share, structured-data and analytics tags are generated from
      src/config/siteConfig.ts (the `seo` block) by vite-plugin-site-head.ts.
      Edit them there, NOT here.
    -->
    <!-- SITE_HEAD -->

    <!-- Preconnect to speed up font loading -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <meta name="msapplication-config" content="/browserconfig.xml" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
